name: Deploy release

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACCOUNT_TOKEN_HMAC_SECRET: ${{ secrets.ACCOUNT_TOKEN_HMAC_SECRET }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      CADDY_SITE: ${{ secrets.CADDY_SITE }}
      COOLDOWN_HMAC_SECRET: ${{ secrets.COOLDOWN_HMAC_SECRET }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      OUTBOX_ENCRYPTION_KEY: ${{ secrets.OUTBOX_ENCRYPTION_KEY }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      SMTP_ADDRESS: ${{ secrets.SMTP_ADDRESS }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      TECH_ADMIN_EMAIL: ${{ secrets.TECH_ADMIN_EMAIL }}
      TECH_ADMIN_PASSWORD: ${{ secrets.TECH_ADMIN_PASSWORD }}
      TECH_ADMIN_USERNAME: ${{ secrets.TECH_ADMIN_USERNAME }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      YANDEX_HOST: ${{ secrets.YANDEX_HOST }}
      YANDEX_SSH_PORT: ${{ secrets.YANDEX_SSH_PORT }}
      YANDEX_SSH_USER: ${{ secrets.YANDEX_SSH_USER }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify immutable release tag
        run: |
          set -eu
          printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Build release images
        run: |
          set -eu
          docker build --build-arg NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL" --tag arhdesign-web:"$GITHUB_SHA" .
          docker build --tag arhdesign-api:"$GITHUB_SHA" apps/api
          docker build --tag arhdesign-postgres-backup:"$GITHUB_SHA" --file infra/backup/Dockerfile infra
          docker build --tag arhdesign-telegram-proxy:"$GITHUB_SHA" infra/telegram-proxy
          docker save \
            arhdesign-web:"$GITHUB_SHA" \
            arhdesign-api:"$GITHUB_SHA" \
            arhdesign-postgres-backup:"$GITHUB_SHA" \
            arhdesign-telegram-proxy:"$GITHUB_SHA" | gzip -1 > release-images.tar.gz
          tar -czf release-files.tar.gz infra apps/api/migrations

      - name: Render production configuration
        run: |
          set -eu
          infra/yandex/render-env.py production.env "$GITHUB_SHA" "$GITHUB_REF_NAME"

      - name: Configure deploy SSH client
        env:
          YANDEX_DEPLOY_SSH_KEY: ${{ secrets.YANDEX_DEPLOY_SSH_KEY }}
        run: |
          set -eu
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$YANDEX_DEPLOY_SSH_KEY" > ~/.ssh/arhdesign_yandex
          chmod 0600 ~/.ssh/arhdesign_yandex
          ssh-keygen -y -f ~/.ssh/arhdesign_yandex >/dev/null
          ssh-keyscan -T 10 -p "$YANDEX_SSH_PORT" "$YANDEX_HOST" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host arh-production
            HostName $YANDEX_HOST
            User $YANDEX_SSH_USER
            Port $YANDEX_SSH_PORT
            IdentityFile ~/.ssh/arhdesign_yandex
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 0600 ~/.ssh/config

      - name: Bootstrap production host
        run: |
          set -eu
          scp infra/yandex/bootstrap-host.sh arh-production:/tmp/bootstrap-host.sh
          ssh arh-production "sudo sh /tmp/bootstrap-host.sh '$YANDEX_SSH_USER'; rm -f /tmp/bootstrap-host.sh"

      - name: Deploy single-node production
        run: |
          set -eu
          scp release-files.tar.gz release-images.tar.gz production.env arh-production:/tmp/
          ssh arh-production 'sh -se' <<'REMOTE'
          set -eu
          test -s /etc/arhdesign/telegram-proxy/id_ed25519
          test -s /etc/arhdesign/telegram-proxy/known_hosts
          tar -xzf /tmp/release-files.tar.gz -C /opt/arhdesign
          sudo install -o root -g arhdesign -m 0640 /tmp/production.env /etc/arhdesign/production.env
          docker load -i /tmp/release-images.tar.gz
          cd /opt/arhdesign
          if docker ps --format '{{.Names}}' | grep -q '^arhdesign-postgres-1$'; then
            docker compose --project-name arhdesign --profile telegram-proxy \
              --env-file /etc/arhdesign/production.env -f infra/docker-compose.yml \
              run --rm -e BACKUP_RUN_ONCE=true postgres-backup
          fi
          docker compose --project-name arhdesign --profile telegram-proxy \
            --env-file /etc/arhdesign/production.env -f infra/docker-compose.yml \
            up -d --no-build --wait --wait-timeout 180
          rm -f /tmp/release-files.tar.gz /tmp/release-images.tar.gz /tmp/production.env
          REMOTE

      - name: Internal production smoke test
        run: |
          set -eu
          ssh arh-production 'sh -se' <<'REMOTE'
          set -eu
          cd /opt/arhdesign
          compose="docker compose --project-name arhdesign --profile telegram-proxy --env-file /etc/arhdesign/production.env -f infra/docker-compose.yml"
          $compose exec -T api wget -q -O /dev/null http://localhost:8080/healthz
          $compose exec -T api wget -q -O /dev/null http://localhost:8080/readyz
          $compose exec -T web node -e "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          $compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile
          REMOTE
