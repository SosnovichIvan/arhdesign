name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce develop-to-main delivery path
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$BASE_REF" = "develop" ] && [ "$HEAD_REF" != "main" ] && [ "$HEAD_REF" != "develop" ]; then
            exit 0
          fi
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" = "develop" ]; then
            exit 0
          fi
          echo "Unsupported pull request path: $HEAD_REF -> $BASE_REF" >&2
          exit 1

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install coverage==7.10.7
      - run: sh -n infra/yandex/bootstrap-host.sh
      - run: python -m unittest infra/yandex/test_render_env.py infra/beget/test_render_env.py
      - name: Enforce Yandex env renderer branch coverage
        run: |
          python -m coverage run --branch --include='*/infra/yandex/render-env.py' \
            -m unittest infra/yandex/test_render_env.py
          python -m coverage report --fail-under=90 -m

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:frontend-adapter
      - run: npm run lint:openapi
      - run: npm run build
      - run: npm run test:coverage
      - run: npm run test:ui:built
      - name: Upload Cypress QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-qa-report
          path: |
            reports/cypress
            cypress/screenshots
          if-no-files-found: warn
          retention-days: 14
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: arhdesign_test
          POSTGRES_USER: arhdesign
          POSTGRES_PASSWORD: test-password
        options: >-
          --health-cmd "pg_isready -U arhdesign -d arhdesign_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: apps/api
    env:
      TEST_DATABASE_URL: postgres://arhdesign:test-password@localhost:5432/arhdesign_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache-dependency-path: apps/api/go.sum
      - run: bash ../../scripts/validate-adapters.sh api
      - run: go test -race -count=1 ./...
      - run: make test-coverage
      # Pin the scanner so CI and release evidence use the same vulnerability database client.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
