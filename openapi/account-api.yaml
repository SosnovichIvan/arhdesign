    ProjectMemberCandidate:
      type: object
      additionalProperties: false
      required: [userId, login, email, firstName, professionalRole]
      properties:
        userId:
          type: string
          format: uuid
        login:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
          nullable: true
        middleName:
          type: string
          nullable: true
        professionalRole:
          $ref: '#/components/schemas/ProfessionalRole'
    ProjectMemberCandidateList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ProjectMemberCandidate'
    AddProjectMemberRequest:
      type: object
