openapi: 3.0.3
info:
  title: arhDesign Account API
  version: 0.2.0
  description: R1 contract for identity, sessions, projects and super-admin user management.
  license:
    name: Proprietary
    url: https://designer-svetlana.ru/
servers:
  - url: /api
tags:
  - name: Auth
    description: Registration, email verification, authentication and session lifecycle.
  - name: Projects
    description: Project creation and management within the actor's visibility scope.
  - name: Users
    description: Super-admin account moderation operations.
  - name: Settings
    description: Per-user interface settings and per-project personal settings.
  - name: Chats
    description: Personal and named group conversations outside project scope.
  - name: TechnicalSupport
    description: Sanitized runtime reports and authenticated product feedback.
security:
  - accountSession: []
paths:
  /v1/auth/register:
    post:
      tags: [Auth]
      operationId: registerAccount
      summary: Register an account and enqueue email verification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Registration was accepted; verification may be delivered asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingVerification'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: A normalized identifier is unavailable; the response does not identify the existing account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Verify an account email with a single-use token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneTimeTokenRequest'
      responses:
        '200':
          description: Email verification completed or had already completed with this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleStatus'
        '400':
          $ref: '#/components/responses/InvalidOrExpiredToken'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Return a generic result and enqueue mail only when applicable
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifierRequest'
      responses:
        '202':
          $ref: '#/components/responses/GenericMailAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/verification-channel:
    post:
      tags: [Auth]
      operationId: selectVerificationChannel
      summary: Select email delivery or hand off confirmation to the Telegram bot
      description: The response is identical for existing and absent identifiers. Credentials are never accepted by this endpoint; Telegram login and password are entered only in the private bot chat.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationChannelRequest'
      responses:
        '202':
          description: The selection was accepted. A Telegram URL is returned for every valid Telegram request and does not reveal account existence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelHandoff'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Authenticate by login or email and create a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated; session and CSRF cookies are rotated.
          headers:
            Set-Cookie:
              description: HttpOnly session cookies and a readable CSRF cookie. Values are never returned in JSON.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Credentials are invalid; login and password are not distinguished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Account is unverified (`account_unverified`) or disabled (`account_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate a single-use refresh token
      security:
        - refreshSession: []
          csrfHeader: []
      responses:
        '200':
          description: Session cookies were rotated.
          headers:
            Set-Cookie:
              description: Rotated session cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session family
      security:
        - accountSession: []
          csrfHeader: []
        - refreshSession: []
          csrfHeader: []
      responses:
        '204':
          description: Current session family was revoked; repeated logout is safe.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password-reset email without disclosing account existence
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRecoveryRequest'
      responses:
        '202':
          $ref: '#/components/responses/GenericMailAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /telegram/webhook:
    post:
      tags: [Auth]
      operationId: receiveTelegramAccountUpdate
      summary: Receive a Telegram Bot API update for account confirmation and recovery
      description: Only private-chat messages are processed. The password message is deleted best-effort after every verification result and its text is never persisted or logged.
      security:
        - telegramWebhookSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramUpdate'
      responses:
        '200':
          description: Update acknowledged, including ignored, duplicate and expired-state updates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramWebhookResult'
        '401':
          description: Telegram webhook secret is absent or invalid.
        '405':
          description: Only POST is accepted.

  /v1/auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Replace a password using a single-use reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password changed; all existing sessions were revoked.
        '400':
          $ref: '#/components/responses/InvalidOrExpiredToken'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/me:
    get:
      tags: [Auth]
      operationId: getCurrentAccount
      summary: Get the current authenticated account
      responses:
        '200':
          description: Current authenticated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/settings:
    get:
      tags: [Settings]
      operationId: getUserSettings
      summary: Get interface settings of the current account
      responses:
        '200':
          description: Settings follow the authenticated account across browsers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    put:
      tags: [Settings]
      operationId: updateUserSettings
      summary: Replace interface settings of the current account
      security:
        - accountSession: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserSettingsRequest'
      responses:
        '200':
          description: Settings were stored for the current account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'

  /v1/chats:
    get:
      tags: [Chats]
      operationId: listGlobalChats
      summary: List global chats visible to the current account
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Chats ordered by most recent activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalChatPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Chats]
      operationId: createGlobalChat
      summary: Create a personal or named group chat
      security:
        - accountSession: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGlobalChatRequest'
      responses:
        '201':
          description: Chat created, or the existing direct chat returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalChatSummary'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/ResourceHidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/chat-user-candidates:
    get:
      tags: [Chats]
      operationId: searchGlobalChatCandidates
      summary: Find active accounts by login or email for chat creation
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        '200':
          description: Bounded candidate list excluding the current account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalChatCandidateList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/chats/{chatId}:
    get:
      tags: [Chats]
      operationId: getGlobalChat
      summary: Read one page of a global conversation
      parameters:
        - $ref: '#/components/parameters/ChatId'
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: before
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Conversation visible to a member or global administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalChatConversation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ResourceHidden'

  /v1/chats/{chatId}/messages:
    post:
      tags: [Chats]
      operationId: createGlobalChatMessage
      summary: Send an idempotent global chat message
      security:
        - accountSession: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ChatId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectChatMessageRequest'
      responses:
        '201':
          description: Message created, or the original response to an identical retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalChatMessage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/ResourceHidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/chats/{chatId}/read:
    post:
      tags: [Chats]
      operationId: markGlobalChatRead
      summary: Advance the current member read marker
      security:
        - accountSession: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ChatId'
      responses:
        '204':
          description: Read marker advanced.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          $ref: '#/components/responses/ResourceHidden'

  /v1/technical/frontend-errors:
    post:
      tags: [TechnicalSupport]
      operationId: reportFrontendError
      summary: Accept a sanitized frontend runtime failure from an authenticated session
      security:
        - accountSession: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrontendErrorReportRequest'
      responses:
        '202':
          description: Report accepted for asynchronous technical notification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/technical/feedback:
    post:
      tags: [TechnicalSupport]
      operationId: createTechnicalFeedback
      summary: Send a complaint or suggestion to the technical administrator
      security:
        - accountSession: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnicalFeedbackRequest'
      responses:
        '202':
          description: Feedback stored and queued for asynchronous delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects visible to the current account
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProjectStatus'
      responses:
        '200':
          description: Projects visible to the actor; hidden projects do not affect counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project with its initial memberships
      security:
        - accountSession: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project and initial memberships were committed atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectView'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project visible to the current account
      responses:
        '200':
          description: Project visible to the actor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ResourceHidden'
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Update a project under optimistic concurrency control
      security:
        - accountSession: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectView'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceHidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Archive/delete a project; only super-admin may perform this R1 action
      security:
        - accountSession: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IfMatchVersion'
      responses:
        '204':
          description: Project was removed from active work; history retention still applies.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceHidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/projects/{projectId}/customer:
    put:
      tags: [Projects]
      operationId: assignProjectCustomer
      summary: Assign or replace the customer membership of a project
      security:
        - accountSession: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [customerUserId]
              properties:
                customerUserId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Customer membership was assigned without rewriting creator/history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectView'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceHidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/projects/{projectId}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: listProjectMembers
      summary: List active participants visible in one project
      responses:
        '200':
          description: Participants are grouped by user; one user may hold more than one project role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ResourceHidden'
    post:
      tags: [Projects]
      operationId: addProjectMember
      summary: Add an active platform user to the project as an executor
      security:
        - accountSession: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProjectMemberRequest'
      responses:
        '201':
          description: The participant was added atomically and an audit event was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMember'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceHidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/projects/{projectId}/member-candidates:
    get:
      tags: [Projects]
      operationId: searchProjectMemberCandidates
      summary: Search active users who are not active participants of the project
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        '200':
          description: At most ten prefix matches by normalized login or email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberCandidateList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceHidden'

  /v1/projects/{projectId}/members/{userId}:
    delete:
      tags: [Projects]
      operationId: removeProjectMember
      summary: Revoke all removable active memberships of one participant
      security:
        - accountSession: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Executor and project-admin memberships were revoked; customer membership cannot be removed here.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceHidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/projects/{projectId}/finance-summary:
    get:
      tags: [Projects]
      operationId: getProjectFinanceSummary
      summary: Get ledger-derived project totals and pending expense requests
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Totals are calculated from immutable confirmed ledger operations; open requests never reduce the balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFinanceSummary'
