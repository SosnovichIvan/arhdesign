        removable:
          type: boolean
          description: False for a participant holding the active customer role.
    ProjectMemberList:
      type: object
      additionalProperties: false
      required: [items, canManage]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ProjectMember'
