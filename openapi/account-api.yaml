        linkedExpenseId: { type: string, format: uuid, nullable: true }
        paymentStatus: { $ref: '#/components/schemas/MaterialPaymentStatus' }
        deliveryStatus: { $ref: '#/components/schemas/MaterialDeliveryStatus' }
        plannedDeliveryOn: { type: string, format: date, nullable: true }
