              $ref: '#/components/schemas/CreateProjectMeetingRequest'
      responses:
        '201':
          description: Meeting and audit record were committed atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectUpcomingItem'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceHidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/admin/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Super-admin-only bounded user list
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AccountStatus'
        - name: identifier
          in: query
          description: Exact normalized login or email; enumeration controls apply.
          schema:
            type: string
            minLength: 3
            maxLength: 254
      responses:
        '200':
          description: User page without password/token/security hashes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/users/{userId}/disable:
    post:
      tags: [Users]
      operationId: disableUser
      summary: Disable an account and revoke all of its sessions
      security:
        - accountSession: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IfMatchVersion'
      responses:
        '200':
          description: User disabled and all sessions revoked; repeated request is safe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceHidden'
        '409':
          description: Version conflict or last active super-admin invariant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/admin/users/{userId}/restore:
    post:
      tags: [Users]
      operationId: restoreUser
      summary: Restore a previously disabled account
      security:
        - accountSession: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IfMatchVersion'
      responses:
        '200':
          description: User restored; repeated request is safe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceHidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/notifications:
    get:
      tags: [Notifications]
      operationId: listAccountNotifications
      summary: List recent project notifications for the current account across all projects
      parameters:
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Recent account notifications and total unread count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountNotificationList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      operationId: markAccountNotificationRead
      summary: Mark one notification owned by the current account as read
      security: [{ accountSession: [], csrfHeader: [] }]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Notification marked as read. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/ResourceHidden' }

  /v1/notifications/read-all:
    post:
      tags: [Notifications]
      operationId: markAllAccountNotificationsRead
      summary: Mark every notification owned by the current account as read
      security: [{ accountSession: [], csrfHeader: [] }]
      responses:
        '204': { description: Notifications marked as read. }
        '401': { $ref: '#/components/responses/Unauthenticated' }

components:
  securitySchemes:
    accountSession:
      type: apiKey
      in: cookie
      name: __Host-arhdesign_session
      description: Opaque server-side session cookie. Raw values are never exposed to JavaScript.
    refreshSession:
      type: apiKey
      in: cookie
      name: __Secure-arhdesign_refresh
      description: Path-scoped, single-use refresh cookie. Raw values are never exposed to JavaScript.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Synchronizer token matching the readable CSRF cookie on state-changing requests.
    telegramWebhookSecret:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
      description: Constant-time compared secret configured when the Telegram webhook is registered.

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChatId:
      name: chatId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 25
    Cursor:
      name: cursor
      in: query
      description: Opaque, signed cursor. Clients must not construct or inspect it.
      schema:
        type: string
        maxLength: 500
    IfMatchVersion:
      name: If-Match
      in: header
      required: true
      description: Quoted decimal optimistic version returned by the previous representation.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'

  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Request rate limit was reached.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    GenericMailAccepted:
      description: Generic response; it never confirms whether an account exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleStatus'
    InvalidOrExpiredToken:
      description: One-time token is invalid, expired, consumed or incompatible with the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthenticated:
      description: No active authenticated session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    CsrfRejected:
      description: Origin or CSRF token validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Actor is authenticated but not allowed to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ResourceHidden:
      description: Resource does not exist or is hidden from this actor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Optimistic version or domain uniqueness conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalError:
      description: Unexpected failure without internal details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: A required security dependency is temporarily unavailable; the operation did not execute.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ThemePreference:
      type: string
      enum: [light, dark]
    UserSettings:
      type: object
      additionalProperties: false
      required: [theme]
      properties:
        theme:
          $ref: '#/components/schemas/ThemePreference'
    UpdateUserSettingsRequest:
      type: object
      additionalProperties: false
      required: [theme]
      properties:
        theme:
          $ref: '#/components/schemas/ThemePreference'
    ProjectUserSettings:
      type: object
      additionalProperties: false
      required: [upcomingDays]
      properties:
        upcomingDays:
          type: integer
          minimum: 1
          maximum: 90
          default: 7
    UpdateProjectUserSettingsRequest:
      type: object
      additionalProperties: false
      required: [upcomingDays]
      properties:
        upcomingDays:
          type: integer
          minimum: 1
          maximum: 90
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [login, email, firstName, professionalRoleCode, password, passwordConfirmation]
      properties:
        login:
          type: string
          pattern: '^[A-Za-z0-9._-]{3,64}$'
        email:
          type: string
          format: email
          maxLength: 254
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        middleName:
          type: string
          maxLength: 100
        professionalRoleCode:
          type: string
          minLength: 2
          maxLength: 64
        password:
          type: string
          format: password
          minLength: 15
          maxLength: 128
        passwordConfirmation:
          type: string
          format: password
          minLength: 15
          maxLength: 128
    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier:
          type: string
          minLength: 3
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
        rememberMe:
          type: boolean
          default: false
    IdentifierRequest:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier:
          type: string
          minLength: 3
          maxLength: 254
    DeliveryChannel:
      type: string
      enum: [email, telegram]
    VerificationChannelRequest:
      type: object
      additionalProperties: false
      required: [identifier, channel]
      properties:
        identifier:
          type: string
          minLength: 3
          maxLength: 254
        channel:
          $ref: '#/components/schemas/DeliveryChannel'
    PasswordRecoveryRequest:
      type: object
      additionalProperties: false
      required: [identifier, channel]
      properties:
        identifier:
          type: string
          minLength: 3
          maxLength: 254
        channel:
          $ref: '#/components/schemas/DeliveryChannel'
    OneTimeTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 512
          writeOnly: true
    ResetPasswordRequest:
      allOf:
        - $ref: '#/components/schemas/OneTimeTokenRequest'
        - type: object
          required: [password, passwordConfirmation]
          properties:
            password:
              type: string
              format: password
              minLength: 15
              maxLength: 128
              writeOnly: true
            passwordConfirmation:
              type: string
              format: password
              minLength: 15
              maxLength: 128
              writeOnly: true
    PendingVerification:
      type: object
      additionalProperties: false
      required: [status, channelSelectionRequired]
      properties:
        status:
          type: string
          enum: [verification_pending]
        channelSelectionRequired:
          type: boolean
          enum: [true]
    ChannelHandoff:
      type: object
      additionalProperties: false
      required: [status, channel]
      properties:
        status:
          type: string
          enum: [accepted]
        channel:
          $ref: '#/components/schemas/DeliveryChannel'
        telegramBotUrl:
          type: string
          format: uri
          nullable: true
          description: Present for Telegram selection. The browser opens this URL; no credentials are entered on the website.
    TelegramUpdate:
      type: object
      additionalProperties: true
      required: [update_id]
      properties:
        update_id:
          type: integer
          format: int64
        message:
          type: object
          nullable: true
          additionalProperties: true
          properties:
            message_id:
              type: integer
              format: int64
            text:
              type: string
            chat:
              type: object
              required: [id, type]
              properties:
                id:
                  type: integer
                  format: int64
                type:
                  type: string
            from:
              type: object
              properties:
                username:
                  type: string
    TelegramWebhookResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [processed, ignored]
    SimpleStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          maxLength: 64
    SessionView:
      type: object
      additionalProperties: false
      required: [account, expiresAt]
      properties:
        account:
          $ref: '#/components/schemas/AccountView'
        expiresAt:
          type: string
          format: date-time
    AccountStatus:
      type: string
      enum: [pending_verification, active, disabled]
    AccountView:
      type: object
      additionalProperties: false
      required: [id, login, email, firstName, professionalRole, status, globalRole, version]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
          nullable: true
        middleName:
          type: string
          nullable: true
        professionalRole:
          $ref: '#/components/schemas/ProfessionalRole'
        status:
          $ref: '#/components/schemas/AccountStatus'
        globalRole:
          type: string
          nullable: true
          enum: [super_admin, technical_admin]
        version:
          type: integer
          format: int64
          minimum: 1
    ProfessionalRole:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
    ProjectRole:
      type: string
      enum: [customer, project_admin, executor]
    ProjectMember:
      type: object
      additionalProperties: false
      required: [userId, login, email, firstName, professionalRole, projectRoles, joinedAt, removable]
      properties:
        userId:
          type: string
          format: uuid
        login:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
          nullable: true
        middleName:
          type: string
          nullable: true
        professionalRole:
          $ref: '#/components/schemas/ProfessionalRole'
        projectRoles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ProjectRole'
        joinedAt:
          type: string
