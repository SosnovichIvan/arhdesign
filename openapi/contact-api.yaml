openapi: 3.0.3
info:
  title: arhDesign Contact API
  version: 1.0.0
  description: Public anonymous endpoint for portfolio contact submissions.
servers:
  - url: /api
paths:
  /v1/contact-submissions:
    post:
      operationId: createContactSubmission
      summary: Create a contact submission
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContactSubmissionRequest'
      responses:
        '201':
          description: Submission was stored successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactSubmissionAccepted'
        '400':
          description: Request does not satisfy server validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Submission is blocked by the one-hour browser cooldown or anti-abuse rate limit.
          headers:
            Retry-After:
              description: Seconds until the next allowed request for this limit.
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected server failure. No submission identifier or internal details are exposed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    operatorSession:
      type: apiKey
      in: cookie
      name: __Host-arhdesign_session
      description: "Reserved for future operator-only endpoints. The public contact endpoint explicitly opts out with security: []."
  schemas:
    CreateContactSubmissionRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - contact
        - projectType
        - consent
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: Visitor name.
          example: Анна Иванова
        contact:
          type: string
          minLength: 5
          maxLength: 254
          description: Email address or phone number supplied by the visitor.
          example: anna@example.com
        projectType:
          type: string
          minLength: 2
          maxLength: 120
          description: Project type selected or entered by the visitor.
          example: Интерьер квартиры
        projectDetails:
          type: string
          maxLength: 5000
          description: Optional visitor project description.
          example: Нужен проект интерьера квартиры 80 м².
        consent:
          type: boolean
          enum: [true]
          description: Explicit consent to personal-data processing.
        website:
          type: string
          maxLength: 0
          description: Honeypot field. A non-empty value is treated as suspicious and is never stored.
    ContactSubmissionAccepted:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum: [accepted]
    ApiError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - validation_error
                - contact_cooldown
                - rate_limited
                - internal_error
            message:
              type: string
              maxLength: 200
            fields:
              type: object
              additionalProperties:
                type: string
              description: Present only for validation errors; values contain no submitted PII.
