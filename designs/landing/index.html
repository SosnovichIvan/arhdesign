<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дизайнер Светлана — Портфолио</title>
  <style>
    /* ========================================
       CSS VARIABLES — ТЕМЫ
       v1.0 — 2026-07-08 — Создание лендинга
    ======================================== */
    :root {
      /* Светлая тема */
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f5;
      --bg-card: #ffffff;
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --text-muted: #999999;
      --border-color: #e5e5e5;
      --accent: #4a4a4a;
      --accent-hover: #333333;
      --shadow: rgba(0, 0, 0, 0.08);
      --overlay: rgba(255, 255, 255, 0.9);
      --chat-bg: #ffffff;
      --chat-text: #1a1a1a;
      --chat-user-bg: #f0f0f0;
    }

    [data-theme="dark"] {
      /* Темная тема */
      --bg-primary: #0a0a0a;
      --bg-secondary: #141414;
      --bg-card: #1a1a1a;
      --text-primary: #f5f5f5;
      --text-secondary: #a0a0a0;
      --text-muted: #666666;
      --border-color: #2a2a2a;
      --accent: #b0b0b0;
      --accent-hover: #d0d0d0;
      --shadow: rgba(0, 0, 0, 0.3);
      --overlay: rgba(10, 10, 10, 0.9);
      --chat-bg: #1a1a1a;
      --chat-text: #f5f5f5;
      --chat-user-bg: #2a2a2a;
    }

    /* ========================================
       RESET & BASE
    ======================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      transition: background-color 0.3s, color 0.3s;
    }

    a {
      color: var(--text-primary);
      text-decoration: none;
      transition: color 0.3s;
    }

    a:hover {
      color: var(--accent);
    }

    img {
      max-width: 100%;
      display: block;
    }

    /* ========================================
       HEADER
       v1.0 — 2026-07-08
    ======================================== */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-color);
      z-index: 100;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .header__container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header__logo {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .header__nav {
      display: none;
      gap: 2rem;
    }

    @media (min-width: 768px) {
      .header__nav {
        display: flex;
      }
    }

    .header__nav a {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .header__nav a:hover {
      color: var(--text-primary);
    }

    .header__actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }

    .btn--ghost {
      background: transparent;
      color: var(--text-primary);
    }

    .btn--ghost:hover {
      background: var(--bg-secondary);
    }

    .btn--primary {
      background: var(--text-primary);
      color: var(--bg-primary);
    }

    .btn--primary:hover {
      opacity: 0.85;
    }

    .theme-toggle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .theme-toggle:hover {
      background: var(--border-color);
    }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
      fill: var(--text-primary);
    }

    .icon-sun, .icon-moon {
      display: none;
    }

    [data-theme="light"] .icon-moon {
      display: block;
    }

    [data-theme="dark"] .icon-sun {
      display: block;
    }

    /* Mobile menu button */
    .mobile-menu-btn {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
    }

    @media (min-width: 768px) {
      .mobile-menu-btn {
        display: none;
      }
    }

    .mobile-menu-btn span {
      width: 20px;
      height: 2px;
      background: var(--text-primary);
      border-radius: 1px;
    }

    /* ========================================
       HERO / CAROUSEL
       v1.0 — 2026-07-08
    ======================================== */
    .hero {
      padding: 8rem 1.5rem 4rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    @media (min-width: 768px) {
      .hero {
        padding: 7rem 2rem 4rem;
      }
    }

    .carousel {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .carousel__track {
      display: flex;
      gap: 1.5rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      padding-bottom: 1rem;
    }

    .carousel__track::-webkit-scrollbar {
      display: none;
    }

    .carousel__slide {
      flex: 0 0 85%;
      scroll-snap-align: start;
      aspect-ratio: 4/3;
      background: var(--bg-secondary);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    @media (min-width: 768px) {
      .carousel__slide {
        flex: 0 0 60%;
      }
    }

    @media (min-width: 1024px) {
      .carousel__slide {
        flex: 0 0 45%;
      }
    }

    .carousel__slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .carousel__slide--tall {
      aspect-ratio: 3/4;
    }

    @media (min-width: 768px) {
      .carousel__slide--tall {
        aspect-ratio: 2/3;
        flex: 0 0 35%;
      }
    }

    .carousel__slide--wide {
      aspect-ratio: 16/9;
    }

    .carousel__controls {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
    }

    .carousel__dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border-color);
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .carousel__dot--active {
      background: var(--text-primary);
      width: 24px;
      border-radius: 4px;
    }

    /* ========================================
       FOOTER
       v1.0 — 2026-07-08
    ======================================== */
    .footer {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      padding: 3rem 1.5rem;
      margin-top: 4rem;
    }

    .footer__container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    @media (min-width: 768px) {
      .footer__container {
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-start;
      }
    }

    .footer__brand {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .footer__logo {
      font-size: 1.125rem;
      font-weight: 600;
    }

    .footer__copy {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .footer__links {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .footer__link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .footer__link:hover {
      color: var(--text-primary);
    }

    .footer__link svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* ========================================
       AI ASSISTANT BUBBLE
       v1.0 — 2026-07-08
    ======================================== */
    .ai-bubble {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--text-primary);
      color: var(--bg-primary);
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s;
      z-index: 1000;
    }

    .ai-bubble:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px var(--shadow);
    }

    .ai-bubble svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    .ai-bubble__pulse {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--text-primary);
      opacity: 0.3;
      animation: pulse 2s ease-out infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 0.3;
      }
      100% {
        transform: scale(1.5);
        opacity: 0;
      }
    }

    /* Chat window (hidden by default) */
    .chat-window {
      position: fixed;
      bottom: 5rem;
      right: 1.5rem;
      width: 350px;
      max-width: calc(100vw - 3rem);
      height: 500px;
      max-height: calc(100vh - 8rem);
      background: var(--chat-bg);
      border-radius: 16px;
      box-shadow: 0 10px 40px var(--shadow);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 999;
      border: 1px solid var(--border-color);
    }

    .chat-window--open {
      display: flex;
    }

    .chat-window__header {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-window__title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .chat-window__close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg-secondary);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
    }

    .chat-window__messages {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .chat-message {
      max-width: 80%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .chat-message--ai {
      background: var(--chat-user-bg);
      color: var(--chat-text);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .chat-message--user {
      background: var(--text-primary);
      color: var(--bg-primary);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .chat-window__input {
      padding: 1rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 0.5rem;
    }

    .chat-window__input input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 0.9rem;
    }

    .chat-window__input input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .chat-window__input button {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: var(--text-primary);
      color: var(--bg-primary);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-window__input button:hover {
      opacity: 0.85;
    }

    .chat-window__input button svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
  </style>
</head>

  <script>
    // Theme toggle
    function toggleTheme() {
      const html = document.documentElement;
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    }

    // Load saved theme
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);

    // Chat toggle
    function toggleChat() {
      const chat = document.getElementById('chatWindow');
      chat.classList.toggle('chat-window--open');
    }

    // Send message
    function sendMessage() {
      const input = document.getElementById('chatInput');
      const message = input.value.trim();
      if (!message) return;

      const messagesContainer = document.querySelector('.chat-window__messages');
      
      // Add user message
      const userMsg = document.createElement('div');
      userMsg.className = 'chat-message chat-message--user';
      userMsg.textContent = message;
      messagesContainer.appendChild(userMsg);

      input.value = '';
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      // Simulate AI response
      setTimeout(() => {
        const aiMsg = document.createElement('div');
        aiMsg.className = 'chat-message chat-message--ai';
        aiMsg.textContent = 'Спасибо за сообщение! Скоро свяжусь с вами для обсуждения деталей.';
        messagesContainer.appendChild(aiMsg);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }, 1000);
    }

    // Enter key for chat
    document.getElementById('chatInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendMessage();
    });

    // Carousel functionality
    const track = document.querySelector('.carousel__track');
    const dots = document.querySelectorAll('.carousel__dot');

    track.addEventListener('scroll', () => {
      const scrollLeft = track.scrollLeft;
      const slideWidth = track.offsetWidth;
      const activeIndex = Math.round(scrollLeft / slideWidth);
      
      dots.forEach((dot, i) => {
        dot.classList.toggle('carousel__dot--active', i === activeIndex);
      });
    });
  </script>
</body>
</html>
