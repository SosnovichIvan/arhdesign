services:
  api:
    depends_on:
      mailpit:
        condition: service_started
    environment:
      ACCOUNT_AUTH_ENABLED: "true"
      PUBLIC_ORIGIN: http://localhost
      ACCOUNT_TOKEN_HMAC_SECRET: local-only-account-token-hmac-secret-change-me
      ACCOUNT_TOKEN_HMAC_KEY_VERSION: "1"
      OUTBOX_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
      OUTBOX_ENCRYPTION_KEY_VERSION: "1"
      SMTP_ADDRESS: mailpit:1025
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      EMAIL_FROM: no-reply@designer-svetlana.local
      EMAIL_TO: admin@designer-svetlana.local
      TELEGRAM_BOT_USERNAME: polismakovaSvetlanaBot
      TECH_ADMIN_USERNAME: ${TECH_ADMIN_USERNAME:-technical.admin}
      TECH_ADMIN_EMAIL: ${TECH_ADMIN_EMAIL:-technical-admin@designer-svetlana.local}
      TECH_ADMIN_PASSWORD: ${TECH_ADMIN_PASSWORD:-development-only-tech-password}

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "8026:8025"
    networks:
      - public
      - private
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: "5m"
    restart: unless-stopped
