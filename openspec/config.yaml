schema: spec-driven

context: |
  Язык всех артефактов: русский.
  Проект: быстрый SEO-ориентированный сайт-портфолио архитектора-дизайнера.
  Базовый стек: Next.js App Router, TypeScript, React Server Components, CSS Modules/Tailwind CSS.
  Первая версия статически генерируется; будущие CMS, админ-панель и личные кабинеты подключаются через изолированные границы.
  Дизайн: Figma file 7CasuBb4xJjm0UYTOGZElV, светлая и тёмная темы, mobile-first, минимум анимации.
  Качество: строгий TypeScript, доступность WCAG 2.2 AA, Core Web Vitals, SEO и визуальная регрессия.

rules:
  proposal:
    - Явно отделять v1 от будущих этапов.
    - Указывать влияние на SEO, производительность и контент.
  specs:
    - Каждый сценарий должен быть проверяем вручную или автоматизированным тестом.
    - Не фиксировать библиотеку или внутреннюю структуру, если это не наблюдаемое поведение.
  design:
    - Для каждого ключевого решения указывать альтернативу и причину отказа.
    - Сохранять обратимый путь к CMS, админ-панели и аутентификации.
  tasks:
    - Каждая задача должна иметь явный проверяемый результат.
    - UI-задачи должны включать desktop, tablet, mobile, light и dark.

operations:
  apply:
    guidance:
      - Не начинать реализацию до принятия OpenSpec-артефактов и выбранной Figma-концепции.
      - Перед отметкой задачи запускать релевантные проверки и Lighthouse/Playwright для критических маршрутов.
  archive:
    guidance:
      - До архивации сверять фактическое поведение с capability specs.
